<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Vanessa — manajemen toko & workshop">
  <!-- Wajib untuk HP (Chrome/MIUI): tanpa ini layout desktop di-scale & teks tampak hilang -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFDE21">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Vanessa">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Vanessa</title>
  <!-- Naikkan angka ini setiap deploy web agar browser tidak pakai main.dart.js lama -->
  <meta name="vanessa-build" content="20260522-manajer-cards">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      background-color: #fafafa;
    }
    flutter-view, flt-glass-pane {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <!-- jsQR untuk scan di browser HP (lebih stabil daripada ZXing/unpkg di mobile) -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" crossorigin="anonymous"></script>
  <!-- Pdf.js untuk plugin printing (preview/cetak web) -->
  <script>
    var dartPdfJsBaseUrl = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.2.146/";
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
