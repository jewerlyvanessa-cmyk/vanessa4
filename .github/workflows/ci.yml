name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-and-flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Backend CI
        run: bash unesential/scripts/ci.sh

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter test
        run: flutter test

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos
